[package]
name = "persistence"
version = "0.1.0"
edition = "2021"
description = "Durable-хранилище состояния платформы (счета брокера + реестр пользователей) за трейтом Persistence (ADR-016)"

[lib]
name = "persistence"
path = "src/lib.rs"

[dependencies]
domain = { path = "../domain" }
broker = { path = "../broker" }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "bigdecimal"] }
bigdecimal = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
