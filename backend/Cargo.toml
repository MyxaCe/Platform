# Cargo workspace — корень проекта.
# domain — общий словарь; core — matching-ядро; ledger — счета/балансы;
# orchestrator — путь ордера; marketdata — свечи; broker — бумажный брокер; gateway — сетевой шлюз.
[workspace]
resolver = "2"
members = ["domain", "core", "ledger", "orchestrator", "marketdata", "broker", "auth", "persistence", "gateway"]
