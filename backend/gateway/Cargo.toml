[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "Сетевой шлюз терминала: REST + WS, данные Binance, бумажный брокер"
default-run = "gateway"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[[bin]]
name = "exclude-history"
path = "src/bin/exclude-history.rs"

[dependencies]
domain = { path = "../domain" }
broker = { path = "../broker" }
persistence = { path = "../persistence" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = { version = "9", default-features = false }
lapin = { version = "2", default-features = false, features = ["rustls"] }
uuid = { version = "1", default-features = false, features = ["std", "v5"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "bigdecimal"] }
