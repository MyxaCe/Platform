[package]
name = "auth"
version = "0.1.0"
edition = "2021"
description = "Пароли (Argon2id) и токены сессий (ADR-018)"

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
# Argon2id — memory-hard KDF, текущая рекомендация OWASP для паролей.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
# SHA-256 — только для токенов сессии: они высокоэнтропийные, медленный хэш там не нужен.
sha2 = "0.10"
base64 = "0.22"
