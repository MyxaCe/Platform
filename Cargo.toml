# Cargo workspace — корень проекта.
# domain — общий словарь; core — matching-ядро; ledger — счета/балансы;
# orchestrator — путь ордера; marketdata — свечи; gateway — сетевой шлюз (REST + WS).
[workspace]
resolver = "2"
members = ["domain", "core", "ledger", "orchestrator", "marketdata", "gateway"]
