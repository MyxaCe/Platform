[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "Сетевой шлюз биржи: REST + WS поверх оркестратора (ADR-010)"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
exchange-core = { path = "../core" }
ledger = { path = "../ledger" }
orchestrator = { path = "../orchestrator" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
