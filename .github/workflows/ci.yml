# Проверки на каждый push и pull request.
# Держим быстрыми: тесты ядра, clippy, синтаксис фронтенда, сборка образов.
name: CI

# НА КАЖДУЮ ВЕТКУ, а не только на master (исправлено 24.10).
#
# Заголовок выше обещал «на каждый push» с самого начала, а фильтр пускал
# только master и main. Расхождение между обещанием и настройкой держалось
# ровно до того дня, когда понадобилось: ветка `trm-48-sandbox` прошла восемь
# коммитов, и CI не запускался на ней НИ РАЗУ — ни одного прогона тестов,
# clippy и формата.
#
# Хуже, что соседний прогон `publish-images.yml` стоит на `on: push` без
# фильтра. То есть образы собирались для всех восьми коммитов, которых
# проверка не видела: **мы публиковали образы для кода, который никто не
# прогонял**. Ровно так 23.10 на сервер уехал образ красного коммита.
#
# Проверка, запускаемая после слияния, — отчёт, а не сторож: к моменту, когда
# она покраснеет, решение уже принято.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Тесты и clippy (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн
        run: rustup component add clippy

      # Кэш реестра и сборки: без него каждый прогон качает и собирает всё заново.
      - name: Кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Эталонная таблица случаев видимости живёт в репозитории CMS, а сверка
      # копии с источником обязана ВЫПОЛНЯТЬСЯ, а не пропускаться: недоступный
      # источник у нас красный, а не «проверено». Поэтому источник сюда
      # приносим, а не отключаем проверку.
      #
      # Берём `main` CMS: если она тронет таблицу, наш прогон покраснеет — это
      # и есть назначение сверки, а не неудобство.
      - name: Контракты CMS (источник эталонной таблицы)
        uses: actions/checkout@v4
        with:
          repository: MyxaCe/Broker_CMS
          ref: main
          path: .cms-contracts

      - name: Тесты
        env:
          CMS_CONTRACTS_DIR: ${{ github.workspace }}/.cms-contracts/src/contracts
        run: |
          if ! cargo test --workspace > /tmp/tests.txt 2>&1; then
            cat /tmp/tests.txt
            grep -E "^(test .* FAILED|thread .* panicked|error\[|error:)" /tmp/tests.txt | head -20               | while IFS= read -r line; do echo "::error::тесты: ${line}"; done
            exit 1
          fi
          tail -3 /tmp/tests.txt

      # -D warnings: предупреждение = ошибка сборки. Тот же режим, что локально.
      #
      # Вывод превращаем в АННОТАЦИИ, а не только в лог. Логи шагов требуют
      # ключа, которого у сессии нет: «запушил — открой прогон» работает лишь
      # тогда, когда прогон читаем снаружи. Без этого видно только «exit 101»,
      # и причина остаётся в недоступном файле.
      #
      # Версию тулчейна печатаем заметкой: расхождение между раннером и
      # локальным образом — первое, на что смотреть, когда clippy зелёный у
      # себя и красный здесь.
      - name: Clippy
        run: |
          echo "::notice::$(rustc --version) | $(cargo clippy --version)"
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings > /tmp/clippy.txt 2>&1; then
            cat /tmp/clippy.txt
            grep -E "^[^ ]+\.rs:[0-9]+" /tmp/clippy.txt | head -20 | while IFS= read -r line; do
              echo "::error::clippy: ${line}"
            done
            grep -E "^error" /tmp/clippy.txt | head -5 | while IFS= read -r line; do
              echo "::error::clippy: ${line}"
            done
            exit 1
          fi

      # Шаг БЛОКИРУЮЩИЙ с 21.10 (TRM-37). Здесь стоял `continue-on-error: true`
      # с пометкой «пока не выравнивали стиль по rustfmt» — дерево выровнено
      # целиком, и отговорка кончилась.
      #
      # Парная строка живёт в `scripts/test.sh`. Это одно решение, записанное
      # дважды, и меняются они ТОЛЬКО ВМЕСТЕ: расхождение в любую сторону —
      # хоть строже локально, хоть слабее — означает «у себя и там по-разному».
      - name: Форматирование
        run: cargo fmt --all -- --check

  frontend:
    name: Синтаксис фронтенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, а не 20: на 20 `node --test` не разворачивает шаблоны путей,
          # и мы это уже поймали. Рабочие машины на 24 — расхождение версий
          # между разработкой и CI само по себе источник таких находок, и
          # сокращать его дешевле, чем ловить каждую по отдельности.
          node-version: 22
      # Сборки у фронта нет, но синтаксическую ошибку ловим здесь: единый app.js
      # падает целиком от одной опечатки, и страница просто белая (bug-log BUG-005).
      - name: node --check по всем модулям
        run: |
          set -e
          find apps -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -I{} node --check {}
          echo "Проверено файлов: $(find apps -name '*.js' -not -path '*/node_modules/*' | wc -l)"

      # Инструменты разработки фронта (решение владельца Р-020: «Разрешаем только
      # для разработки»). jsdom нужен тестам виджетов — те строят настоящий DOM.
      # В поставку не идёт: образ собирается из public/ как есть, npm в Dockerfile
      # не участвует.
      - name: Зависимости разработки фронта
        working-directory: apps/terminal
        run: npm ci

      # Тесты фронтенда зовутся через `npm test`, а НЕ своим шаблоном путей.
      # Прежняя строка здесь перечисляла `tests/*.test.js` — и браузерные
      # проверки из `tests/browser/` в прогон бы не вошли: тест, который не
      # входит в прогон, не существует, и узнать об этом было бы неоткуда.
      # Один источник истины о том, что считается прогоном, — package.json.
      #
      # Браузерным проверкам (TRM-18) нужен Chrome; на ubuntu-latest он есть.
      # Если его не окажется, харнесс падает с внятным текстом, а не
      # пропускает молча: непройденное обязано быть отличимо от пройденного.
      #  начинается с проверки типов (TRM-21): опечатка в имени поля
      # иначе ловится только тестом, который по этому полю ходит.
      # Браузер ставим ЯВНО, а не надеемся на содержимое образа раннера:
      # защита, держащаяся на побочном свойстве чего-то другого, отваливается
      # молча. Харнесс без браузера падает громко (так и задумано), но падать
      # он должен от настоящей поломки, а не от того, что мы не позаботились.
      - name: Браузер для браузерных проверок
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          echo "Найден: $(command -v chromium-browser || command -v chromium)"

      - name: Проверка типов, тесты модульные и браузерные
        working-directory: apps/terminal
        run: |
          if ! npm test > /tmp/front.txt 2>&1; then
            cat /tmp/front.txt
            grep -E "(НЕ ОТРАБОТАЛ|отказы —|error TS|^✖)" /tmp/front.txt | head -20               | while IFS= read -r line; do echo "::error::фронт: ${line}"; done
            exit 1
          fi
          tail -6 /tmp/front.txt

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ловим поломку Dockerfile до того, как она встретится на сервере.
      - name: docker compose build
        run: docker compose build

      # Образ собрался — ещё не значит, что он работает. `/config.js` терминала
      # рендерится скриптом в /docker-entrypoint.d, а nginx молча пропускает
      # оттуда неисполняемые файлы: отказ выглядит строкой лога, ответ остаётся
      # 200, и вместо конфига уезжает index.html (B-OPS-016). Проверяем на
      # запущенном образе и по непустым значениям — пустые неотличимы от
      # невыполненной подстановки.
      - name: /config.js собранного образа — конфиг, а не index.html
        run: bash scripts/check-config-js.sh
