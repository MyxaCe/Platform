name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Тесты и clippy (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: terminal_ci
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Тулчейн
        run: rustup component add clippy

      - name: Кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Контракты CMS (источник эталонной таблицы)
        uses: actions/checkout@v4
        with:
          repository: MyxaCe/Broker_CMS
          ref: main
          path: .cms-contracts

      - name: Тесты
        env:
          CMS_CONTRACTS_DIR: ${{ github.workspace }}/.cms-contracts/src/contracts
        run: |
          if ! cargo test --workspace > /tmp/tests.txt 2>&1; then
            cat /tmp/tests.txt
            grep -E "^(test .* FAILED|thread .* panicked|error\[|error:)" /tmp/tests.txt | head -20               | while IFS= read -r line; do echo "::error::тесты: ${line}"; done
            exit 1
          fi
          tail -3 /tmp/tests.txt

      - name: Живые проверки к PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/terminal_ci
        run: |
          if ! cargo test --workspace -- --ignored --test-threads=1 > /tmp/live.txt 2>&1; then
            cat /tmp/live.txt
            grep -E "^(test .* FAILED|thread .* panicked|error\[|error:)" /tmp/live.txt | head -20               | while IFS= read -r line; do echo "::error::живые проверки: ${line}"; done
            exit 1
          fi
          grep -E "^test result" /tmp/live.txt
          PASSED=$(grep -E "^test result" /tmp/live.txt | awk '{s+=$4} END {print s+0}')
          echo "::notice::живые проверки к БД: пройдено ${PASSED}"
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::живые проверки не выполнились ни разу — шаг отработал вхолостую"
            exit 1
          fi

      - name: Clippy
        run: |
          echo "::notice::$(rustc --version) | $(cargo clippy --version)"
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings > /tmp/clippy.txt 2>&1; then
            cat /tmp/clippy.txt
            grep -E "^[^ ]+\.rs:[0-9]+" /tmp/clippy.txt | head -20 | while IFS= read -r line; do
              echo "::error::clippy: ${line}"
            done
            grep -E "^error" /tmp/clippy.txt | head -5 | while IFS= read -r line; do
              echo "::error::clippy: ${line}"
            done
            exit 1
          fi

      - name: Форматирование
        run: cargo fmt --all -- --check

  frontend:
    name: Синтаксис фронтенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check по всем модулям
        run: |
          set -e
          find apps -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -I{} node --check {}
          echo "Проверено файлов: $(find apps -name '*.js' -not -path '*/node_modules/*' | wc -l)"

      - name: Зависимости разработки фронта
        working-directory: apps/terminal
        run: npm ci

      - name: Браузер для браузерных проверок
        run: |
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null; then echo "Найден: $(command -v "$b")"; exit 0; fi
          done
          for i in 1 2 3; do
            sudo apt-get update -qq && { sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium; } && break
            echo "apt: попытка $i не удалась, жду"; sleep 20
          done
          echo "Найден: $(command -v chromium-browser || command -v chromium)"

      - name: Проверка типов, тесты модульные и браузерные
        working-directory: apps/terminal
        run: |
          if ! npm test > /tmp/front.txt 2>&1; then
            cat /tmp/front.txt
            grep -E "(НЕ ОТРАБОТАЛ|отказы —|error TS|^✖)" /tmp/front.txt | head -20               | while IFS= read -r line; do echo "::error::фронт: ${line}"; done
            exit 1
          fi
          tail -6 /tmp/front.txt

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build

      - name: /config.js собранного образа — конфиг, а не index.html
        run: bash scripts/check-config-js.sh
