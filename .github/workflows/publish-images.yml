name: Образы

# ПУБЛИКАЦИЯ ОБРАЗОВ · OPS-23, зона `deploy`.
#
# Собираем здесь, сервер только скачивает. Сборка на сервере не даёт ответить,
# какая ревизия работает, — это уже стоило платформе трёх поколений прод-CRM с
# тегом `latest`.
#
# ТЕГ — ПОЛНЫЙ ХЕШ КОММИТА И НИЧЕГО БОЛЬШЕ. `latest` не заводится вовсе, и это
# проверяется механизмом (шаг «Запрет latest»), а не доверием к читателю.
#
# ЭТОТ ПРОГОН НЕ ЗАМЕНЯЕТ `deploy.yml`, А ДЕЛАЕТ ЕГО НЕНУЖНЫМ В НЫНЕШНЕМ ВИДЕ:
# там на сервере выполняется `docker compose up --build`, то есть сборка на
# сервере. Правка `deploy.yml` — не эта задача; дефект назван штабу.
#
# ОБА ОБРАЗА ОКРУЖЕНИЕ-АГНОСТИЧНЫ, и это их свойство, а не недосмотр:
# у шлюза аргументов сборки нет, фронт рендерит конфиг из env на старте
# (ADR-023). Поэтому домена здесь нет и быть не может — в отличие от витрины
# и кабинета, где публичные адреса вшиваются на сборке.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Гейт проверок читает реестр прогонов. Без этого права
  # запрос вернул бы 404, а 404 у нас не «прогонов нет».
  actions: read

concurrency:
  # Прерванная публикация оставила бы тег наполовину, а тег неизменяем и
  # второй раз не пишется.
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # ГЕЙТ ПРОВЕРОК · OPS-36. Коммит с красной проверкой не порождает образа.
  #
  # До этого задания CI и сборка образов шли ПАРАЛЛЕЛЬНО, и параллельно —
  # недостаточно: красный прогон успевал оставить в реестре тег, которому
  # уже нельзя верить, а выкатка адресуется коммитом и про цвет проверки
  # ничего не знает. 24.10 я развернул `27396e5` при красном master именно
  # так: образ существовал, значит выглядел пригодным.
  #
  # ПОЧЕМУ ОТДЕЛЬНЫМ ЗАДАНИЕМ, А НЕ ШАГОМ В МАТРИЦЕ. Вердикт о коммите
  # один. Матрица спросила бы реестр прогонов четырежды и могла бы
  # получить четыре разных ответа — тогда «образ есть» перестало бы
  # означать «коммит проверен».
  #
  # ПОЧЕМУ НЕ ШТАТНЫЙ `workflow_run`. Он запускает зависимый процесс
  # только из файла в ветке по умолчанию и только для неё. Образы
  # собираются на любой ветке, потому что деплой адресуется коммитом, а
  # не веткой; `workflow_run` отнял бы это молча.
  #
  # ЦЕНА НАЗВАНА. Задание занимает раннер, пока идёт CI, и сдвигает
  # появление образа на всё время проверок. Платим сознательно: образ,
  # появившийся раньше вердикта, — это образ, про который нечего сказать.
  proverka:
    name: Проверки коммита зелены
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Дождаться проверок и потребовать зелени
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # ЗАВИСИМОСТЬ ОБЪЯВЛЕНА, А НЕ ПРЕДПОЛОЖЕНА. «На образе раннера
          # сегодня есть» — свойство образа, а не нашего прогона.
          command -v python3 >/dev/null 2>&1 || {
            echo "::error::нет python3 — ответ реестра разобрать нечем, состояние проверок НЕИЗВЕСТНО"
            exit 1
          }

          # ОХВАТ ОБЪЯВЛЕН СПИСКОМ, А НЕ ВЫВЕДЕН ИЗ НАЙДЕННОГО.
          # «Все прогоны этого коммита зелены» при нуле прогонов истинно и
          # пусто: проверка, не проверившая ничего, неотличима от проверки,
          # не нашедшей нарушений. Поэтому процессы перечислены поимённо,
          # длина списка — объявленный охват, и с ним сверяется осмотренное.
          TREBUEMYE='ci.yml'

          GRACE_MIN=3       # за сколько прогон обязан ПОЯВИТЬСЯ
          DEADLINE_MIN=30   # за сколько обязан ЗАВЕРШИТЬСЯ

          obyavleno=0
          for wf in $TREBUEMYE; do obyavleno=$((obyavleno + 1)); done
          if [ "$obyavleno" -eq 0 ]; then
            echo "::error::список требуемых проверок пуст — сторож без объявленного охвата не сторожит"
            exit 1
          fi
          echo "коммит: $SHA"
          echo "объявленный охват: $obyavleno — $TREBUEMYE"

          grace_do=$(( $(date +%s) + GRACE_MIN * 60 ))
          deadline=$(( $(date +%s) + DEADLINE_MIN * 60 ))
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows"

          while :; do
            teper=$(date +%s)
            osmotreno=0; zeljonyh=0; zhdjom=''; krasnoe=''; netprogona=''

            for wf in $TREBUEMYE; do
              kod=$(curl -sS -o otvet.json -w '%{http_code}' \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H 'Accept: application/vnd.github+json' \
                    -H 'X-GitHub-Api-Version: 2022-11-28' \
                    "$api/$wf/runs?head_sha=$SHA&per_page=100") || kod=000

              # МОЛЧАНИЕ РЕЕСТРА — ЭТО НЕ «ПРОГОНОВ НЕТ».
              # Наивный разбор склеивает два исхода в один пустой список, и
              # сторож начинает пропускать всё подряд ровно тогда, когда API
              # перестаёт отвечать. Видел на себе 24.10: опрос без ключа
              # выбрал часовой лимит, и дальше каждый ответ был ошибкой, по
              # форме неотличимой от «прогонов не найдено».
              if [ "$kod" != 200 ]; then
                echo "::error::реестр прогонов ответил $kod по $wf — состояние проверок НЕИЗВЕСТНО, образ не собираем"
                head -c 500 otvet.json; echo
                exit 1
              fi

              svodka=$(python3 .github/razbor-progonov.py otvet.json) || {
                echo "::error::ответ реестра по $wf не разобрался — состояние НЕИЗВЕСТНО, образ не собираем"
                head -c 500 otvet.json; echo
                exit 1
              }
              # РАЗБОР, НЕ ДАВШИЙ ЧИСЕЛ, — ЭТО НЕ НОЛЬ.
              # Первая редакция считала через jq, а на стенде jq не было:
              # три пустые строки провалились в ветку «всё зелено», и сторож
              # пропустил красный прогон. Поймано до выкатки, но ровно этим
              # способом сторожа и перестают сторожить.
              set -- $svodka
              vsego="${1:-}"; idut="${2:-}"; upali="${3:-}"
              case "$vsego$idut$upali" in
                ''|*[!0-9]*)
                  echo "::error::разбор вернул «$svodka» вместо трёх чисел — состояние НЕИЗВЕСТНО"
                  exit 1;;
              esac

              if [ "$upali" -gt 0 ]; then
                krasnoe="$krasnoe $wf"
              elif [ "$vsego" -eq 0 ]; then
                netprogona="$netprogona $wf"
              elif [ "$idut" -gt 0 ]; then
                zhdjom="$zhdjom $wf"
              else
                osmotreno=$((osmotreno + 1))
                zeljonyh=$((zeljonyh + vsego))
              fi
            done

            if [ -n "$krasnoe" ]; then
              echo "::error::проверка красна:$krasnoe — коммит $SHA образа не порождает"
              exit 1
            fi

            [ -z "$zhdjom" ] && [ -z "$netprogona" ] && break

            # Прогон заводится через секунды после пуша. Если его нет и через
            # grace — его не будет вовсе: процесс не настроен на эту ветку или
            # на это событие. Полчаса ждать, чтобы сказать то же самое, незачем.
            if [ -n "$netprogona" ] && [ "$teper" -ge "$grace_do" ]; then
              echo "::error::за $GRACE_MIN мин не заведено ни одного прогона:$netprogona"
              echo "::error::коммит $SHA проверкой НЕ ПОКРЫТ. Ноль проверок — не зелень; образ не собираем"
              exit 1
            fi

            if [ "$teper" -ge "$deadline" ]; then
              echo "::error::за $DEADLINE_MIN мин проверки не завершились:$zhdjom$netprogona — вердикта нет, образ не собираем"
              exit 1
            fi

            echo "идут:$zhdjom$netprogona · готово $osmotreno из $obyavleno"
            sleep 20
          done

          # Охват печатается числом и сверяется с объявленным. Ноль здесь
          # перестаёт быть тишиной и становится величиной, на которой падают.
          echo "осмотрено процессов: $osmotreno из объявленных $obyavleno; зелёных прогонов: $zeljonyh"
          if [ "$osmotreno" -ne "$obyavleno" ]; then
            echo "::error::осмотрено $osmotreno, объявлено $obyavleno — охват не сошёлся"
            exit 1
          fi
          {
            echo "### Проверки коммита"
            echo ""
            echo "осмотрено процессов: **$osmotreno** из объявленных **$obyavleno**; зелёных прогонов: **$zeljonyh**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Собрать и опубликовать · ${{ matrix.image }}
    needs: proverka
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: broker-terminal-gateway
            context: ./backend
            dockerfile: gateway/Dockerfile
          - image: broker-terminal-web
            context: ./apps/terminal
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа и тег
        id: ref
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/${IMAGE}"
          tag="${{ github.sha }}"

          # ГЕЙТ ФОРМЫ ТЕГА. Работает над вычисленным значением, а не над
          # текстом файла: плавающий тег не пройдёт сюда, откуда бы ни взялся.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::тег «$tag» не является полным хешем коммита; плавающие теги запрещены"
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Два разных запрета, и сливать их нельзя: первый про то, что `latest`
      # не должен существовать никогда, второй — что существующий тег не
      # переписывается. Разные причины, разные починки.
      - name: Запрет latest
        run: |
          set -uo pipefail
          out=$(docker manifest inspect "$IMAGE_REF:latest" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::в реестре есть $IMAGE_REF:latest — плавающий тег запрещён платформой, удалите версию пакета"
            exit 1
          fi
          echo "latest отсутствует. Ответ реестра (печатаем целиком, чтобы отказ прав не выглядел отсутствием тега):"
          echo "$out"

      - name: Неизменяемость тега
        run: |
          set -uo pipefail
          out=$(docker manifest inspect "$IMAGE_REF:$IMAGE_TAG" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::$IMAGE_REF:$IMAGE_TAG уже опубликован. Тег неизменяем: перезапись запрещена. Нужен новый образ — нужен новый коммит."
            echo "$out" | head -20
            exit 1
          fi
          echo "тега ещё нет, публикуем. Ответ реестра:"
          echo "$out"

      - uses: docker/setup-buildx-action@v3

      # Собираем в локальный демон, а НЕ сразу в реестр: метку ревизии надо
      # проверить до публикации, иначе красный прогон оставит в реестре тег,
      # которому нельзя верить.
      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.ref.outputs.ref }}:${{ steps.ref.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            com.broker.public-addresses=none
            com.broker.built-by=${{ github.workflow }}/${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Метка ревизии стоит и совпадает с коммитом
        run: |
          set -euo pipefail
          got=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF:$IMAGE_TAG")
          if [ "$got" != "$IMAGE_TAG" ]; then
            echo "::error::метка ревизии «$got» не равна коммиту «$IMAGE_TAG» — из чего собран образ, ответить нечем"
            exit 1
          fi
          echo "revision=$got"
          docker inspect --format '{{json .Config.Labels}}' "$IMAGE_REF:$IMAGE_TAG"

      - name: Публикация
        run: docker push "$IMAGE_REF:$IMAGE_TAG"

      - name: Итог
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE_REF:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| образ | \`$IMAGE_REF\` |"
            echo "| тег (неизменяемый) | \`$IMAGE_TAG\` |"
            echo "| digest | \`$digest\` |"
            echo ""
            echo "Скачать: \`docker pull $IMAGE_REF@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pull:
    name: Скачать обратно · ${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Поведение без окружения установлено ЗАПУСКОМ 25.10, не выведено
          # из кода. Оба образа СТАРТУЮТ, и оба — осознанно.
          #
          # Шлюз поднимается без SSO и сам говорит почему: «для автономного
          # терминала это норма; если экземпляр встроен в кабинет — это
          # дефект, люди увидят сделки друг друга». Решение зоны терминала,
          # и объявление ниже делает его ВИДИМЫМ: если платформа решит, что
          # встроенному шлюзу стартовать без личности нельзя, меняется эта
          # строка, и гейт начинает требовать отказа.
          - { image: broker-terminal-gateway, bez-okruzhenija: start }
          # Статика за nginx: переменных не требует по устройству.
          - { image: broker-terminal-web,     bez-okruzhenija: start }
    steps:
      # Отдельное задание на чистом раннере — иначе «скачивается» проверялось бы
      # на машине, где образ уже лежит в демоне с момента сборки.
      - name: Имя образа
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      # НЕ ГЕЙТ, И ЭТО СКАЗАНО ВСЛУХ: публичность пакета — решение владельца.
      # Публичный сервер тянет без ключа, приватный требует токена на чтение.
      # Оба состояния законны, шаг сообщает, какое сейчас.
      - name: Видимость пакета — анонимная попытка
        run: |
          set -uo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker pull "$IMAGE_REF:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ПАКЕТ ПУБЛИЧНЫЙ: сервер скачает без ключа"
            echo "- \`${{ matrix.image }}\` — **публичный**" >> "$GITHUB_STEP_SUMMARY"
            docker rmi "$IMAGE_REF:$IMAGE_TAG" >/dev/null 2>&1 || true
          else
            echo "ПАКЕТ ПРИВАТНЫЙ: серверу понадобится токен на чтение пакетов"
            echo "- \`${{ matrix.image }}\` — **приватный**, серверу нужен токен" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Скачать и сверить ревизию
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF:$IMAGE_TAG"
          got=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF:$IMAGE_TAG")
          if [ "$got" != "$IMAGE_TAG" ]; then
            echo "::error::скачанный образ собран из «$got», а запрашивали «$IMAGE_TAG»"
            exit 1
          fi
          echo "скачан $IMAGE_REF:$IMAGE_TAG, ревизия сходится"

      # ЗАПУСК БЕЗ ОКРУЖЕНИЯ. Устройство предложено зоной `site-platform`,
      # формулировка про НАЗВАННЫЙ отказ — её.
      #
      # ЧТО БЫЛО НЕ ТАК. До этого шага задание доказывало «образ
      # скачивается»: тянуло его и сверяло метку ревизии. Контейнер не
      # запускался ни разу, то есть «образ работает» не проверялось ничем.
      # Задание писал я и разницу не заметил.
      #
      # ПОЧЕМУ НЕДОСТАТОЧНО «НЕНУЛЕВОГО КОДА ВЫХОДА». Падение с
      # `Cannot find module` тоже даёт ненулевой код — а это ровно
      # `B-OPS-029`, ради которого проверка и заводится. Наивный сторож
      # пропустил бы тот самый дефект. Поэтому требуется отказ НАЗВАННЫЙ:
      # в выводе обязано быть собственное сообщение приложения и обязана
      # ОТСУТСТВОВАТЬ ошибка разрешения модулей.
      #
      # ПОЧЕМУ ОЖИДАНИЕ ОБЪЯВЛЕНО ДЛЯ КАЖДОГО ОБРАЗА, А НЕ ОБЩЕЕ. Правило
      # «без окружения обязан отказать» верно там, где так устроено
      # приложение, и неверно всюду: статика за nginx законно поднимается
      # без единой переменной. Общее правило дало бы сторожа, который
      # краснеет по делу в одной зоне и не по делу в соседней, — а такого
      # отключают первым же авралом. Необъявленное поведение — отказ:
      # сторож без объявленного ожидания не сторожит.
      #
      # ПОЧЕМУ С СЕТЬЮ. Вопрос этого шага — про ОКРУЖЕНИЕ. Запуск с
      # `--network none` мерил бы заодно и сеть: у образов, чья точка
      # входа тянет пакетный менеджер, отказ приходил бы от сети, а
      # выглядел бы как отказ приложения. Поймано на себе 25.10.
      - name: Образ без окружения ведёт себя как объявлено
        env:
          OZHIDANIE: ${{ matrix.bez-okruzhenija }}
          SLOVO: ${{ matrix.slovo }}
          ZADACHA: ${{ matrix.zadacha }}
        run: |
          set -uo pipefail

          case "$OZHIDANIE" in
            otkaz|start) ;;
            # ТРЕТЬЕ ОБЪЯВЛЕНИЕ — «поведение известно и оно дефектно».
            # Нужно там, где образ не отказывает и не стартует, а делает
            # ХУЖЕ обоих: завершается успехом, не сделав ничего. Подвести
            # такое под `start` значило бы благословить молчаливый успех,
            # а не объявить вовсе — получить красный без причины.
            # Красное здесь ожидаемо и несёт номер задачи.
            defekt)
              echo "::error::${{ matrix.image }}: поведение без окружения объявлено ДЕФЕКТНЫМ, см. ${ZADACHA:-задачу в матрице}"
              echo "::error::красное здесь — не поломка проверки, а открытая задача. Снимается её закрытием и сменой объявления"
              exit 1;;
            *)
              echo "::error::для ${{ matrix.image }} не объявлено поведение без окружения (bez-okruzhenija: otkaz|start|defekt)"
              exit 1;;
          esac
          if [ "$OZHIDANIE" = otkaz ] && [ -z "$SLOVO" ]; then
            echo "::error::объявлен отказ, но не объявлено СЛОВО, по которому он узнаётся"
            exit 1
          fi
          echo "объявлено: $OZHIDANIE${SLOVO:+, узнаётся по «$SLOVO»}"

          # Вывод в файл, а НЕ в трубу: `cmd | head` отдаёт код `head`, и
          # код контейнера теряется. Я на этом ошибся в тот же день, когда
          # писал этот шаг.
          set +e
          timeout 60 docker run --rm "$IMAGE_REF:$IMAGE_TAG" > vyhod.txt 2>&1
          kod=$?
          set -e
          echo "код выхода: $kod, строк вывода: $(wc -l < vyhod.txt)"
          echo '--- вывод образа ---'
          head -30 vyhod.txt
          echo '--------------------'

          # ОШИБКА РАЗРЕШЕНИЯ МОДУЛЕЙ — КРАСНОЕ В ЛЮБОМ СЛУЧАЕ.
          # Образ, не нашедший собственный код, сломан независимо от того,
          # что мы ожидали от окружения.
          if grep -qiE 'cannot find module|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND' vyhod.txt; then
            echo "::error::образ не находит собственные модули — это B-OPS-029, а не отказ по окружению"
            exit 1
          fi

          if [ "$OZHIDANIE" = otkaz ]; then
            # 124 — образ не завершился за минуту. Объявлен отказ, значит
            # «висит» и есть нарушение: служба без окружения поднялась и
            # обслуживает, не зная, чья она.
            if [ "$kod" -eq 124 ]; then
              echo "::error::объявлен отказ, но образ не завершился за 60 с — он поднялся без окружения"
              exit 1
            fi
            if [ "$kod" -eq 0 ]; then
              echo "::error::объявлен отказ, но образ завершился успешно"
              exit 1
            fi
            if ! grep -qF "$SLOVO" vyhod.txt; then
              echo "::error::отказ есть, но БЕЗ ИМЕНИ: в выводе нет «$SLOVO». Ненулевой код сам по себе ничего не значит"
              exit 1
            fi
            echo "отказ названный: код $kod, слово на месте"
          else
            # Объявлен чистый старт: образ обязан пережить минуту.
            if [ "$kod" -ne 124 ]; then
              echo "::error::объявлен чистый старт, но образ завершился с кодом $kod"
              exit 1
            fi
            echo "стартовал и прожил минуту, как объявлено"
          fi

          {
            echo "- \`${{ matrix.image }}\` — без окружения: **$OZHIDANIE**, проверено запуском"
          } >> "$GITHUB_STEP_SUMMARY"

