# Автономный терминал: postgres (состояние) + gateway (REST+WS, внутренний) +
# terminal (nginx: статика + прокси на gateway). Наружу торчит только terminal :8888.
# (8888 — потому что диапазон 8080–8282 занят WinNAT на dev-машине.)
#
# Пивот 2026-07-25: терминал стал самодостаточным продуктом для встраивания в чужие
# сайты. Логина/сессий/поддоменов/edge больше нет — один демо-счёт по умолчанию.
services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    environment:
      # Значения по умолчанию — только для разработки. На сервере задаются в .env
      # (см. .env.example): выкатывать прод с паролем "platform" нельзя.
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # gateway стартует только когда БД реально принимает подключения: иначе он
      # упадёт на restore_state (работать на неизвестном состоянии счетов нельзя).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: exchange-gateway
    environment:
      # Задан → PgStore (ADR-016). Убрать переменную → всё в памяти, как раньше.
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      # SSO платформы (ADR-023, Т2). CABINET_URL → JWKS {CABINET_URL}/api/sso/jwks.
      # Из контейнера кабинет на хосте доступен как host.docker.internal.
      CABINET_URL: ${CABINET_URL:-http://host.docker.internal:3002}
      # SSO_DISABLED=1 (dev по умолчанию): торговые ручки НЕ требуют сессию (счёт по
      # умолчанию), но /v1/session валидирует токены против живого JWKS. Прод: 0.
      SSO_DISABLED: ${SSO_DISABLED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  terminal:
    build:
      context: ./apps/terminal
      dockerfile: Dockerfile
    container_name: exchange-terminal
    environment:
      # Кто может встраивать терминал в iframe (CSP frame-ancestors, ADR-023).
      # Дефолт "*" = открыто (dev). Прод: список доменов сайтов платформы через .env.
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-*}
    ports:
      - "8888:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
