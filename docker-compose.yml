# Платформа целиком: postgres (состояние) + gateway (REST+WS, внутренний) +
# terminal (торговый терминал) + site (сайт брокера).
# Наружу торчит только edge (:8888) и маршрутизирует по поддоменам, как в проде:
#   lvh.me:8888 — сайт · accounts.lvh.me:8888 — вход
#   trade.lvh.me:8888 — терминал · my.lvh.me:8888 — кабинет
# lvh.me — публичное DNS-имя в 127.0.0.1: правки hosts не нужны, а для браузера это
# обычный домен, поэтому единая cookie на поддомены работает (с localhost — нет).
# (8888 — потому что диапазон 8080–8282 занят WinNAT на dev-машине.)
services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    environment:
      # Значения по умолчанию — только для разработки. На сервере задаются в .env
      # (см. .env.example): выкатывать прод с паролем "platform" нельзя.
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # gateway стартует только когда БД реально принимает подключения: иначе он
      # упадёт на restore_state (работать на неизвестном состоянии счетов нельзя).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: exchange-gateway
    environment:
      # Задан → PgStore (ADR-016). Убрать переменную → всё в памяти, как раньше.
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      # Сессия должна действовать на всех поддоменах (accounts/trade/my), а не только
      # там, где выполнен вход (ADR-019). В проде — .вашдомен.
      # Локально нельзя писать localhost: браузер ОТБРАСЫВАЕТ cookie с Domain=localhost
      # целиком (проверено — вход переставал работать). Поэтому lvh.me: это публичное
      # DNS-имя, которое резолвится в 127.0.0.1, и для браузера оно обычный домен.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.lvh.me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  terminal:
    build:
      context: ./apps/terminal
      dockerfile: Dockerfile
    container_name: exchange-terminal
    depends_on:
      - gateway
    restart: unless-stopped

  site:
    build:
      context: ./apps
      dockerfile: site/Dockerfile
    container_name: exchange-site
    depends_on:
      - gateway          # лендинг берёт живые котировки через прокси на шлюз
    restart: unless-stopped

  cabinet:
    build:
      context: ./apps
      dockerfile: cabinet/Dockerfile
    container_name: exchange-cabinet
    depends_on:
      - gateway          # кабинет показывает счёт и сделки через прокси на шлюз
    restart: unless-stopped

  accounts:
    build:
      context: ./apps
      dockerfile: accounts/Dockerfile
    container_name: exchange-accounts
    depends_on:
      - gateway
    restart: unless-stopped

  edge:
    build:
      context: ./apps
      dockerfile: edge/Dockerfile
    container_name: exchange-edge
    ports:
      - "8888:80"
    depends_on:
      - site
      - accounts
      - terminal
      - cabinet
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
