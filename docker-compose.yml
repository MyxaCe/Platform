services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: exchange-gateway
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      CABINET_URL: ${CABINET_URL:-http://host.docker.internal:3002}
      SSO_DISABLED: ${SSO_DISABLED:-1}
      DEMO_START_BALANCE_CENTS: ${DEMO_START_BALANCE_CENTS:-1000000}
      CMS_BASE_URL: ${CMS_BASE_URL:-}
      CMS_API_KEY: ${CMS_API_KEY:-}
      TENANT_INSTRUMENTS: ${TENANT_INSTRUMENTS:-}
      MARKET_V2_API_URL: ${MARKET_V2_API_URL:-}
      MARKET_V2_WS_URL: ${MARKET_V2_WS_URL:-}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-}
      PLATFORM_INSTRUMENTS_CACHE: /data/platform-instruments.json
      CLOSE_ONLY_REJECT_PENDING_ENABLED: ${CLOSE_ONLY_REJECT_PENDING_ENABLED:-0}
      MARGIN_STOP_OUT_LEVEL_PERCENT: ${MARGIN_STOP_OUT_LEVEL_PERCENT:-50}
      MARGIN_CALL_LEVEL_PERCENT: ${MARGIN_CALL_LEVEL_PERCENT:-100}
      MARGIN_CALL_REARM_BAND_PERCENT: ${MARGIN_CALL_REARM_BAND_PERCENT:-10}
      NEGATIVE_BALANCE_PROTECTION: ${NEGATIVE_BALANCE_PROTECTION:-1}
      MIN_STOP_BPS: ${MIN_STOP_BPS:-0}
      SLTP_EDIT_ENABLED: ${SLTP_EDIT_ENABLED:-0}
      BUS_URL: ${BUS_URL:-}
      BUS_EXCHANGE: ${BUS_EXCHANGE:-platform.events}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  terminal:
    build:
      context: ./apps/terminal
      dockerfile: Dockerfile
    container_name: exchange-terminal
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-*}
      BRAND_URL: ${BRAND_URL:-}
      CABINET_ORIGIN: ${CABINET_ORIGIN:-}
    ports:
      - "8888:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
  gateway-data:
