<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exchange — BTC-USDT</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/vendor/lightweight-charts.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> EXCHANGE <span class="muted">BTC-USDT · наш движок</span></div>
    <div class="topbar__right">
      <span id="lastPrice" class="lastprice">—</span>
      <button id="autoBtn" class="btn btn--accent">▶ Авто-демо</button>
      <span id="status" class="status status--off">● offline</span>
    </div>
  </header>

  <main class="layout">
    <!-- Стакан -->
    <aside class="panel book">
      <div class="panel__head">Стакан</div>
      <div class="book__head"><span>Цена</span><span class="ta-right">Кол-во</span></div>
      <div id="asks" class="book__side book__side--asks"></div>
      <div id="spread" class="book__spread">—</div>
      <div id="bids" class="book__side book__side--bids"></div>
    </aside>

    <!-- График -->
    <section class="panel chartpane">
      <div class="panel__head">График (свечи из сделок)</div>
      <div id="chart" class="chart"></div>
    </section>

    <!-- Сделки + форма -->
    <aside class="panel side">
      <div class="panel__head">Заявка</div>
      <form id="orderForm" class="form">
        <div class="row2">
          <select id="actor"><option value="alice-token">Alice</option><option value="bob-token">Bob</option></select>
          <select id="otype"><option value="limit">Лимит</option><option value="market">Рынок</option></select>
        </div>
        <div class="row2">
          <button type="button" class="btn side-btn side-btn--buy active" data-side="buy">Купить</button>
          <button type="button" class="btn side-btn side-btn--sell" data-side="sell">Продать</button>
        </div>
        <input id="price" type="number" step="0.01" placeholder="Цена" />
        <input id="qty" type="number" step="0.001" placeholder="Кол-во" value="1" />
        <button type="submit" class="btn btn--submit">Отправить</button>
        <div id="formMsg" class="formmsg"></div>
      </form>
      <div class="panel__head">Лента сделок</div>
      <div class="trades__head"><span>Цена</span><span class="ta-right">Кол-во</span><span class="ta-right">Время</span></div>
      <div id="trades" class="trades"></div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
