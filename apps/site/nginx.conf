server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache"; # dev: браузер всегда сверяет актуальность
  }

  # Когда сайту понадобится API (заявки, регистрация) — путь добавляется сюда,
  # как в терминале. Граница (/|$) обязательна, иначе статика с тем же префиксом
  # уедет в прокси (см. bug-log BUG-007).
}
