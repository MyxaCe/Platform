# Маршрутизация по поддоменам (ADR-019). В разработке работает без DNS и без правки
# hosts: браузеры резолвят *.localhost в 127.0.0.1 сами. В проде те же имена
# становятся настоящими поддоменами, конфиг не меняется.
#
#   localhost:8888            → сайт брокера
#   accounts.localhost:8888   → вход и регистрация
#   trade.localhost:8888      → торговый терминал
#   my.localhost:8888         → личный кабинет

server {
  listen 80;
  server_name accounts.*;
  location / { proxy_pass http://accounts:80; proxy_set_header Host $host; }
  location ~ ^/(auth)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}

server {
  listen 80;
  server_name trade.*;
  location / { proxy_pass http://terminal:80; proxy_set_header Host $host; }
  location /stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location ~ ^/(orders|book|balance|instruments|candles|depth|stats|deals|pending|account|auth|admin|health)(/|$) {
    proxy_pass http://gateway:8080; proxy_set_header Host $host;
  }
}

server {
  listen 80;
  server_name my.*;
  location / { proxy_pass http://cabinet:80; proxy_set_header Host $host; }
  location ~ ^/(auth|account|deals|pending|instruments)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}

# Сайт — по умолчанию: и на голом localhost, и на www.
server {
  listen 80 default_server;
  server_name _;
  location / { proxy_pass http://site:80; proxy_set_header Host $host; }
  location ~ ^/(instruments|auth)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}
