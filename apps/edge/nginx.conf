# Маршрутизация по поддоменам + терминация HTTPS (ADR-019).
#
#   meriom.com            → сайт брокера
#   accounts.meriom.com   → вход и регистрация
#   trade.meriom.com      → торговый терминал
#   my.meriom.com         → личный кабинет
#
# Локально meriom.com указывает на 127.0.0.1 (A-записи в DNS), сертификат —
# доверенный локальный от mkcert (apps/edge/certs, в git не попадает). server_name
# с `*` матчит и meriom.com, и прежний lvh.me — при переезде на прод меняются
# только DNS и сертификат, конфиг остаётся.

# HTTP → HTTPS: Passkey/WebAuthn и Secure-cookie требуют защищённого контекста.
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name accounts.*;
  ssl_certificate     /etc/nginx/certs/meriom.pem;
  ssl_certificate_key /etc/nginx/certs/meriom-key.pem;
  location / { proxy_pass http://accounts:80; proxy_set_header Host $host; }
  location ~ ^/(auth)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}

server {
  listen 443 ssl;
  server_name trade.*;
  ssl_certificate     /etc/nginx/certs/meriom.pem;
  ssl_certificate_key /etc/nginx/certs/meriom-key.pem;
  location / { proxy_pass http://terminal:80; proxy_set_header Host $host; }
  location /stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location ~ ^/(orders|book|balance|instruments|candles|depth|stats|deals|pending|account|auth|admin|health)(/|$) {
    proxy_pass http://gateway:8080; proxy_set_header Host $host;
  }
}

server {
  listen 443 ssl;
  server_name my.*;
  ssl_certificate     /etc/nginx/certs/meriom.pem;
  ssl_certificate_key /etc/nginx/certs/meriom-key.pem;
  location / { proxy_pass http://cabinet:80; proxy_set_header Host $host; }
  location ~ ^/(auth|account|deals|pending|instruments)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}

# Сайт — по умолчанию: сам meriom.com, www и всё, что не совпало с поддоменами выше.
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/certs/meriom.pem;
  ssl_certificate_key /etc/nginx/certs/meriom-key.pem;
  location / { proxy_pass http://site:80; proxy_set_header Host $host; }
  location ~ ^/(instruments|auth)(/|$) { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
}
