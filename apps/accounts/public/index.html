<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExchangePro — Sign in</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="auth">
    <div class="card">
      <a class="brand" href="/"><span class="brand__mark">E</span><span>Exchange<b>Pro</b></span></a>

      <!-- Шаг 1: почта -->
      <section class="step" data-step="email">
        <h1 data-i18n="s1.title">Log in or sign up</h1>
        <p class="sub" data-i18n="s1.sub">Enter your email to continue.</p>
        <form id="formEmail" novalidate>
          <label class="fld">
            <span data-i18n="f.email">Email</span>
            <input id="email" type="email" autocomplete="email" autofocus />
            <em class="err" id="errEmail"></em>
          </label>
          <button class="btn btn--accent" type="submit" data-i18n="f.next">Next</button>
        </form>

        <div class="sep"><span data-i18n="s1.or">or continue with</span></div>
        <div class="providers" id="providers"></div>
        <p class="note" id="provNote" data-i18n="s1.provNote"></p>
      </section>

      <!-- Шаг 2: пароль -->
      <section class="step hidden" data-step="password">
        <button class="back" id="backToEmail" type="button">← <span data-i18n="f.back">Back</span></button>
        <h1 id="pwTitle" data-i18n="s2.title">Enter your password</h1>
        <p class="sub" id="pwEmail"></p>
        <form id="formPass" novalidate>
          <label class="fld">
            <span data-i18n="f.password">Password</span>
            <span class="ctrl">
              <input id="password" type="password" />
              <button class="peek" id="peek" type="button" aria-label="Show password">👁</button>
            </span>
            <em class="err" id="errPass"></em>
          </label>
          <label class="fld hidden" id="confirmWrap">
            <span data-i18n="f.confirm">Confirm password</span>
            <input id="confirm" type="password" autocomplete="new-password" />
            <em class="err" id="errConfirm"></em>
          </label>
          <label class="check hidden" id="agreeWrap">
            <input type="checkbox" id="agree" /><span class="agree"></span>
          </label>
          <em class="err" id="errAgree"></em>
          <button class="btn btn--accent" type="submit" id="pwSubmit" data-i18n="f.continue">Continue</button>
        </form>
      </section>

      <!-- Шаг 3: код из письма -->
      <section class="step hidden" data-step="code">
        <h1 data-i18n="s3.title">Confirm your email</h1>
        <p class="sub" id="codeSub"></p>
        <form id="formCode" novalidate>
          <label class="fld">
            <span data-i18n="f.code">Verification code</span>
            <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
            <em class="err" id="errCode"></em>
          </label>
          <button class="btn btn--accent" type="submit" data-i18n="f.verify">Verify</button>
          <button class="btn btn--ghost" type="button" id="resend" data-i18n="f.resend">Resend code</button>
        </form>
        <div class="devnote hidden" id="devNote"></div>
      </section>

      <!-- Готово -->
      <section class="step hidden" data-step="done">
        <div class="ok">✓</div>
        <h1 data-i18n="s4.title">You're all set</h1>
        <p class="sub" data-i18n="s4.sub">Your account is ready.</p>
        <a class="btn btn--accent" id="toCabinet" href="#" data-i18n="s4.cabinet">Go to client area</a>
        <a class="btn btn--ghost" id="toTerminal" href="#" data-i18n="s4.terminal">Open terminal</a>
      </section>
    </div>

    <footer class="foot">
      <button class="lang" id="langBtn">EN</button>
      <button class="lang" id="themeBtn">◐</button>
      <a href="/" id="toSite" data-i18n="foot.site">Back to site</a>
    </footer>
  </main>

  <script>window.__themeKey = 'accounts';</script>
  <script src="/shared/i18n.js"></script>
  <script src="/shared/theme.js"></script>
  <script src="/dict.js"></script>
  <script src="/accounts.js"></script>
</body>
</html>
