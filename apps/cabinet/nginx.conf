server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache"; # dev: браузер всегда сверяет актуальность
  }

  # Кабинет показывает данные счёта, поэтому ходит в шлюз. Граница (/|$) обязательна,
  # иначе статика с тем же префиксом уедет в прокси (bug-log BUG-007).
  location ~ ^/(auth|account|deals|pending|instruments)(/|$) {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }
}
