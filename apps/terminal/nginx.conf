server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache"; # dev: браузер всегда сверяет актуальность
    # Кто может встраивать терминал в iframe (White Label, ADR-023). Значение —
    # из env FRAME_ANCESTORS (envsubst на старте). Дефолт "*" = открыто (dev); когда
    # платформа пришлёт домены сайтов, задаём список, напр.:
    #   FRAME_ANCESTORS="https://apex-ru.example https://site-b.example"
    add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS};" always;
  }

  # Страница выхода терминала верхнего уровня (sso.js). Отдельный location
  # нужен ради короткого адреса /logout; заголовки — те же, что у страницы
  # терминала: add_header в nginx не наследуется во вложенный location.
  location = /logout {
    try_files /logout.html =404;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS};" always;
  }

  # WebSocket-лента → gateway
  location /stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # Внутренние ручки шлюза (/internal — денежные операции сайта) НАРУЖУ НЕ ИДУТ.
  # Проксирование ниже — явным списком, и /internal в нём нет; но без этого
  # блока запрос ушёл бы в `location /` и получил index.html с 200 — «ответ
  # есть», хотя ручки нет. Сайт ходит на шлюз напрямую по внутренней сети.
  # `^~` — чтобы ни одно регулярное выражение ниже не перехватило префикс.
  location ^~ /internal {
    return 404;
  }

  # REST API → gateway (v1 — SSO-сессии, ADR-023).
  # Граница (/|$) обязательна: иначе /stats.js и т.п. статика уедет в прокси (BUG-004).
  location ~ ^/(v1|instruments|candles|depth|stats|deals|pending|account|health)(/|$) {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }
}
