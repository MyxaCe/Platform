server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache"; # dev: браузер всегда сверяет актуальность
  }

  # WebSocket-лента → gateway
  location /stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # REST API → gateway
  # Граница (/|$) обязательна: иначе /stats.js и т.п. статика уедет в прокси (BUG-004).
  location ~ ^/(instruments|candles|depth|stats|deals|pending|account|health)(/|$) {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }
}
